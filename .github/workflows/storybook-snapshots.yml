name: Generate Storybook snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    # This is deliberately separate from the Storybook production check.
    # Generated images must be reviewed and committed before CI validates them.
    name: Generate Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build Storybook
        run: npm run build-storybook
      - name: Generate candidate baselines
        run: npm run test:storybook:prepared -- --update-snapshots --retries=0
      - name: Upload candidates for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: storybook-linux-snapshots
          path: tests/storybook/__screenshots__/linux/
          if-no-files-found: error
          retention-days: 7
